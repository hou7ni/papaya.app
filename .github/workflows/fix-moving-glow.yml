name: Fix moving glow borders
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.html')
          s=p.read_text()
          css='''<style id="papaya-moving-glow">.input-row{border-color:#d8d8d8!important}.input-row:before{content:""!important;position:absolute!important;inset:0!important;border:1px solid #d8d8d8!important;border-radius:18px!important;background:none!important;z-index:3!important;pointer-events:none!important}.input-row:after{content:""!important;position:absolute!important;inset:0!important;background:#fff!important;border-radius:18px!important;z-index:0!important;pointer-events:none!important}.input-row .moving-glow,.profile .moving-glow{position:absolute;width:100%;height:100%;inset:0;z-index:4;pointer-events:none;overflow:visible}.input-row .moving-glow rect,.profile .moving-glow rect{fill:none;stroke-linecap:round;stroke-dashoffset:0;animation-timing-function:linear;animation-iteration-count:infinite}.input-row .moving-glow rect{stroke:url(#inputGlow);stroke-width:2.5;stroke-dasharray:16 84;filter:url(#inputGlowFilter);animation:papayaInputGlow 3.8s linear infinite}.profile{border:1px solid #d6d6d6!important;background:#fff!important}.profile:before{content:""!important;position:absolute!important;inset:0!important;border:1px solid #d6d6d6!important;border-radius:16px!important;background:none!important;z-index:3!important;padding:0!important;pointer-events:none!important}.profile .moving-glow rect{stroke:url(#profileGlow);stroke-width:3;stroke-dasharray:23 77;filter:url(#profileGlowFilter);animation:papayaProfileGlow 4.2s linear infinite}@keyframes papayaInputGlow{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}@keyframes papayaProfileGlow{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}body.dark .input-row:after{background:#17191e!important}body.dark .input-row:before{border-color:#383b42!important}body.dark .profile{background:#181a1f!important;border-color:#383b42!important}body.dark .profile:before{border-color:#383b42!important}</style>'''
          if 'id="papaya-moving-glow"' not in s:s=s.replace('</style></head>',css+'</style></head>')
          if 'class="moving-glow"' not in s:
            inp='<svg class="moving-glow" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="inputGlow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".3" stop-color="#f7c928" stop-opacity=".9"/><stop offset=".5" stop-color="#fff"/><stop offset=".7" stop-color="#b66cff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><filter id="inputGlowFilter" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect x="1" y="1" width="98" height="98" rx="18" pathLength="100"/></svg>'
            prof='<svg class="moving-glow" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="profileGlow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".28" stop-color="#f7c928" stop-opacity=".95"/><stop offset=".5" stop-color="#fff"/><stop offset=".72" stop-color="#b66cff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><filter id="profileGlowFilter" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect x="1" y="1" width="98" height="98" rx="16" pathLength="100"/></svg>'
            s=s.replace('<div class="input-row" id="inputRow"><textarea','<div class="input-row" id="inputRow">'+inp+'<textarea')
            s=s.replace('<div class="profile"><div class="profile-content">','<div class="profile">'+prof+'<div class="profile-content">')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html
          git diff --cached --quiet || (git commit -m 'Implement true moving glow border trails' && git push)
