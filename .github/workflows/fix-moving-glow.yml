name: Fix moving glow borders
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.html')
          s=p.read_text()
          css=Path('.github/moving-glow.css').read_text()
          inp=Path('.github/input-glow.svg').read_text()
          prof=Path('.github/profile-glow.svg').read_text()
          if 'id="papaya-moving-glow"' not in s:
              s=s.replace('</style></head>',css+'</style></head>')
          if 'class="moving-glow"' not in s:
              s=s.replace('<div class="input-row" id="inputRow"><textarea','<div class="input-row" id="inputRow">'+inp+'<textarea')
              s=s.replace('<div class="profile"><div class="profile-content">','<div class="profile">'+prof+'<div class="profile-content">')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html
          git diff --cached --quiet || git commit -m 'Implement true moving glow border trails'
          git push
          rm -f .github/moving-glow.css .github/input-glow.svg .github/profile-glow.svg .github/workflows/fix-moving-glow.yml
          git add -A
          git diff --cached --quiet || git commit -m 'Remove temporary glow patch files'
          git push || true
