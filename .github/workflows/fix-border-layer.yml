name: Fix border layer
on:
  push:
    paths:
      - '.github/workflows/fix-border-layer.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.html')
          s=p.read_text()
          old='z-index:0;animation:inputBorder 2.8s linear infinite;transform-origin:center}.input-row:after'
          new='z-index:1;animation:inputBorder 2.8s linear infinite;transform-origin:center}.input-row:after'
          if old not in s:
            raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html
          git commit -m 'Show moving input border' || true
          git rm .github/workflows/fix-border-layer.yml
          git commit -m 'Remove temporary border workflow'
          git push