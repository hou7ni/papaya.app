name: Apply Premium UI patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.html')
          s=p.read_text()
          if 'premium-user .side-premium' in s:
              raise SystemExit(0)
          s=s.replace('.side-premium .premium-btn{width:100%;height:44px}', '.side-premium .premium-btn{width:100%;height:44px}.premium-user .side-premium{display:none}', 1)
          old='.profile{position:relative;margin-top:0;padding:12px;border:1px solid transparent;border-radius:16px;background:#fff;overflow:hidden;isolation:isolate}.profile:before{content:"";position:absolute;inset:-1px;border-radius:17px;background:conic-gradient(from 0deg,#f7c928,#ff9d00,#b66cff,#f7c928);animation:spin 3.2s linear infinite;z-index:-2}.profile:after{content:"";position:absolute;inset:1px;border-radius:15px;background:#fff;z-index:-1}'
          new='.profile{position:relative;margin-top:0;padding:12px;border:2px solid transparent;border-radius:16px;background:linear-gradient(#fff,#fff) padding-box,conic-gradient(from var(--profile-angle),#f7c928,#ff9d00,#b66cff,#f7c928) border-box;overflow:hidden;isolation:isolate;--profile-angle:0deg}.profile:before{content:"";position:absolute;inset:-2px;border-radius:17px;padding:1px;background:conic-gradient(from var(--profile-angle),transparent 0deg,transparent 300deg,rgba(255,255,255,.95) 340deg,transparent 360deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:2}.profile:after{display:none}'
          if old in s:
              s=s.replace(old,new,1)
          else:
              raise SystemExit('profile block not found')
          s=s.replace('.input-row:before{content:"";position:absolute;inset:-1px;border-radius:19px;background:conic-gradient(from 0deg,#f7c928,#ff9d00,#b66cff,#f7c928);animation:spin 3.2s linear infinite;z-index:0;opacity:.9}.input-row:after{content:"";position:absolute;inset:1px;border-radius:17px;background:#fff;z-index:0}', '.input-row:before{content:"";position:absolute;inset:-1px;border-radius:19px;padding:1px;background:conic-gradient(from var(--input-angle),transparent 0deg,transparent 305deg,rgba(247,201,40,.15) 325deg,rgba(255,255,255,.95) 345deg,rgba(182,108,255,.7) 355deg,transparent 360deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:0;--input-angle:0deg;animation:inputBorder 4.2s linear infinite}.input-row:after{content:"";position:absolute;inset:0;border-radius:18px;background:#fff;z-index:0;pointer-events:none}',1)
          s=s.replace('@keyframes spin{to{transform:rotate(360deg)}}','@property --profile-angle{syntax:"<angle>";inherits:false;initial-value:0deg}@property --input-angle{syntax:"<angle>";inherits:false;initial-value:0deg}@keyframes spin{to{transform:rotate(360deg)}}@keyframes profileBorder{to{--profile-angle:360deg}}@keyframes inputBorder{to{--input-angle:360deg}}',1)
          anchor='currentUser=session.user;const meta=currentUser.user_metadata||{};'
          repl='currentUser=session.user;const {data:profile}=await supabaseApp.from(\'profiles\').select(\'is_premium\').eq(\'id\',currentUser.id).maybeSingle();if(profile?.is_premium===true)document.body.classList.add(\'premium-user\');const meta=currentUser.user_metadata||{};'
          if anchor not in s:
              raise SystemExit('auth anchor not found')
          s=s.replace(anchor,repl,1)
          p.write_text(s)
          PY
      - name: Commit patched app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html
          git diff --cached --quiet && exit 0
          git commit -m "Detect Premium users and animate borders"
          git push