name: Fix animations
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-animations.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch animations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.html')
          s=p.read_text()
          s=s.replace('z-index:0;animation:inputBorder 2.8s linear infinite;transform-origin:center}.input-row:after', 'z-index:1;animation:inputBorder 2.8s linear infinite;transform-origin:center}.input-row:after')
          s=s.replace('body.dark .input-row:after{background:#17191e}', 'body.dark .input-row:after{background:#17191e}')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html
          git commit -m 'Fix input animation visibility' || true
          git rm .github/workflows/fix-animations.yml || true
          git commit -m 'Remove temporary animation workflow' || true
          git push