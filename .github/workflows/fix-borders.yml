name: Fix borders
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.html')
          s=p.read_text()
          s=s.replace('z-index:1;animation:inputBorder 2.8s linear infinite;transform-origin:center}.input-row:after','z-index:3;animation:inputBorder 2.8s linear infinite;transform-origin:center;will-change:transform}.input-row:after')
          s=s.replace('@keyframes profileBorder{to{transform:rotate(360deg)}}@keyframes inputBorder{to{transform:rotate(360deg)}}','@keyframes profileBorder{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}@keyframes inputBorder{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}')
          s=s.replace('body.dark .profile{background:linear-gradient(#181a1f,#181a1f) padding-box,linear-gradient(135deg,#f7c928,#ff9d00,#b66cff,#f7c928) border-box;border-color:transparent}','body.dark .profile{background:linear-gradient(#181a1f,#181a1f) padding-box,linear-gradient(135deg,#f7c928,#ff9d00,#b66cff,#f7c928) border-box;border-color:transparent}')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html
          git commit -m 'Fix visible border animations' || exit 0
          git push
