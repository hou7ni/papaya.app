ient(90deg,rgba(15,14,8,.7),rgba(15,14,8,.12) 12%,transparent 26%,transparent 74%,rgba(15,14,8,.12) 88%,rgba(15,14,8,.7))}.content{position:relative;z-index:4;width:100%;height:100%;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:28px 22px 24px}.top{width:min(1080px,100%);text-align:center;flex:none}.title{display:inline-flex;align-items:center;justify-content:center;padding:10px 21px;border-radius:17px;color:#fff;font-size:22px;font-weight:900;background:linear-gradient(120deg,#f7c928,#ff9d00,#b66cff,#f7c928);background-size:300% 300%;box-shadow:0 8px 28px rgba(247,201,40,.25),0 0 26px rgba(182,108,255,.18);animation:premiumFlow 4.5s ease-in-out infinite}.benefits{width:min(760px,100%);margin:22px auto 24px;text-align:left;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}.benefit{position:relative;display:flex;align-items:center;min-height:50px;padding:0 16px 0 48px;border:1px solid rgba(247,201,40,.22);border-radius:15px;background:rgba(255,255,255,.9);box-shadow:0 6px 20px rgba(0,0,0,.06);font-size:14px;line-height:1.35;font-weight:700;color:#202020}.benefit:before{content:"";position:absolute;left:17px;top:50%;width:14px;height:14px;border-radius:50%;transform:translateY(-50%);background:linear-gradient(135deg,#f7c928,#ff9d00,#b66cff);box-shadow:0 0 14px rgba(182,108,255,.3)}.benefit:after{content:"✓";position:absolute;left:17px;top:50%;width:14px;height:14px;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:900}.checkout-shell{position:relative;width:min(1120px,100%);flex:1;min-height:0;margin-top:2px;border-radius:34px 34px 0 0;padding:1px;overflow:hidden;background:linear-gradient(125deg,#f7c928,#ff9d00,#b66cff,#f7c928);background-size:300% 300%;animation:premiumFlow 5.5s ease-in-out infinite;box-shadow:0 -2px 34px rgba(247,201,40,.16),0 0 34px rgba(182,108,255,.12)}.checkout-inner{width:100%;height:100%;min-height:0;border-radius:33px 33px
