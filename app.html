<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Papaya — Créateur de logo</title><meta name="theme-color" content="#f7c928"><link rel="icon" type="image/png" sizes="32x32" href="./papaya-favicon.png"><link rel="apple-touch-icon" href="./papaya-favicon.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff;color:#171717;overflow:hidden}.app{min-height:100vh;display:flex;flex-direction:column}.top{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid #eee;background:rgba(255,255,255,.92);backdrop-filter:blur(12px)}.logo{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800}.logo img{width:36px;height:36px;border-radius:10px;object-fit:cover}.new{border:1px solid #e8e8e8;background:#fff;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer}.chat{flex:1;display:flex;justify-content:center;overflow:auto}.inner{width:min(900px,calc(100% - 36px));padding:70px 0 130px}.intro{text-align:center;animation:fadeUp .55s ease both}.intro h1{font-size:42px;line-height:1.08;margin:0 0 12px;letter-spacing:-1.5px}.intro p{margin:0;color:#777;font-size:16px}.step{margin-top:42px;animation:fadeUp .6s ease both}.step h2{font-size:17px;margin:0 0 16px}.styles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.style{position:relative;min-height:155px;border:1px solid #e7e7e7;border-radius:18px;background:#fff;padding:14px;cursor:pointer;overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s}.style:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,.07)}.style.selected{border:2px solid #f1bd16;box-shadow:0 8px 28px rgba(247,201,40,.18)}.preview{height:102px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;margin-bottom:10px}.minimal .preview{background:#f4f4f4;color:#111}.bold .preview{background:#111;color:#fff}.playful .preview{background:#fff0a8;color:#d58c00;border-radius:30px}.luxury .preview{background:#191919;color:#f7c928;font-family:Georgia,serif}.style span{font-size:13px;font-weight:700}.selected:after{content:'✓';position:absolute;right:12px;bottom:10px;width:22px;height:22px;border-radius:50%;background:#f7c928;display:flex;align-items:center;justify-content:center;font-size:13px}.brief{margin-top:28px;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .45s ease,transform .45s ease}.brief.visible{opacity:1;transform:translateY(0);pointer-events:auto}.briefbox{border:1px solid #e5e5e5;border-radius:18px;background:#fff;padding:8px;display:flex;align-items:flex-end;box-shadow:0 8px 30px rgba(0,0,0,.05)}textarea{width:100%;min-height:82px;resize:none;border:0;outline:0;padding:13px;font:inherit;font-size:15px}.generate{border:0;background:#f7c928;border-radius:13px;padding:13px 19px;font-weight:800;cursor:pointer;white-space:nowrap}.hint{text-align:center;color:#999;font-size:12px;margin-top:10px}.result{display:none;text-align:center;padding-top:50px;animation:fadeUp .5s ease both}.result.show{display:block}.result h2{font-size:28px;margin:0 0 8px}.result p{color:#777;margin:0}.logo-result{width:260px;height:260px;border-radius:28px;margin:30px auto;background:#fafafa;border:1px solid #eee;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:900}.logo-result.minimal{background:#f4f4f4;color:#111}.logo-result.bold{background:#111;color:#fff}.logo-result.playful{background:#fff0a8;color:#d58c00;border-radius:60px}.logo-result.luxury{background:#191919;color:#f7c928;font-family:Georgia,serif}@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@media(max-width:700px){.top{padding:0 16px}.inner{padding:45px 0 100px}.intro h1{font-size:31px}.styles{grid-template-columns:repeat(2,1fr)}.style{min-height:145px}.preview{height:92px}.briefbox{display:block}.generate{width:100%;margin-top:5px}.logo-result{width:220px;height:220px}}</style></head><body><div class="app"><header class="top"><div class="logo"><img src="./papaya-logo.svg" alt="Papaya"><span>Papaya</span></div><button class="new" id="newChat">+ Nouveau logo</button></header><main class="chat"><div class="inner"><section class="intro" id="intro"><h1>Crée ton logo.</h1><p>Choisis un style, décris ton business et Papaya s'occupe du reste.</p></section><section class="step" id="styleStep"><h2>1. Choisis ton style</h2><div class="styles"><button class="style minimal" data-style="minimal" type="button"><div class="preview">Aa</div><span>Minimaliste</span></button><button class="style bold" data-style="bold" type="button"><div class="preview">B</div><span>Bold</span></button><button class="style playful" data-style="playful" type="button"><div class="preview">✦</div><span>Fun & créatif</span></button><button class="style luxury" data-style="luxury" type="button"><div class="preview">A</div><span>Premium</span></button></div></section><section class="brief" id="brief"><div class="briefbox"><textarea id="description" placeholder="Ex. Papaya est un SaaS qui aide les créateurs à trouver des idées de contenu..."></textarea><button class="generate" id="generate" type="button">Créer le logo</button></div><div class="hint">Décris simplement ton business, ton nom ou ce que tu veux représenter.</div></section><section class="result" id="result"><h2>Ton logo est prêt.</h2><p>Voici une première direction basée sur ton style.</p><div class="logo-result" id="logoResult">P</div></section></div></main></div><script>const supabaseApp=window.supabase.createClient('https://xokmhuoqtncownuodqpe.supabase.co','sb_publishable_rVr3X7iYwJJExCqeBnWTxA_LoUWrede');(async()=>{const {data:{session},error}=await supabaseApp.auth.getSession();if(error||!session){location.replace('./index.html');return;}document.body.dataset.authenticated='true';})();let selectedStyle='';const cards=document.querySelectorAll('.style'),brief=document.getElementById('brief'),description=document.getElementById('description'),result=document.getElementById('result'),logoResult=document.getElementById('logoResult');cards.forEach(card=>card.addEventListener('click',()=>{cards.forEach(c=>c.classList.remove('selected'));card.classList.add('selected');selectedStyle=card.dataset.style;brief.classList.add('visible');setTimeout(()=>description.focus(),250)}));document.getElementById('generate').addEventListener('click',()=>{if(!selectedStyle||!description.value.trim())return;logoResult.className='logo-result '+selectedStyle;const text=description.value.trim();const name=text.split(/\s+/)[0]||'P';logoResult.textContent=name.slice(0,2).toUpperCase();result.classList.add('show');result.scrollIntoView({behavior:'smooth',block:'center'})});document.getElementById('newChat').addEventListener('click',()=>{selectedStyle='';cards.forEach(c=>c.classList.remove('selected'));brief.classList.remove('visible');result.classList.remove('show');description.value='';window.scrollTo({top:0,behavior:'smooth'})});</script></body></html>
