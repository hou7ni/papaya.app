gap:18px;padding:40px 0 20px}.bubble{max-width:72%;padding:13px 16px;border-radius:17px;font-size:15px;line-height:1.45;animation:fadeUp .45s ease both}.bubble.user{align-self:flex-end;background:#f7c928}.bubble.ai{align-self:flex-start;background:#f5f5f5}.logo-card{margin-top:14px;width:330px;height:330px;border-radius:28px;background:#f7f7f7;border:1px solid #e9e9e9;display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:900;animation:fadeUp .6s cubic-bezier(.16,1,.3,1) both}.composer{position:absolute;left:0;right:0;bottom:0;padding:25px 24px 27px;background:linear-gradient(transparent,rgba(255,255,255,.96) 30%,#fff 55%);display:flex;justify-content:center}.composer-inner{width:min(900px,100%);border:1px solid #dedede;border-radius:24px;background:#fff;box-shadow:0 16px 45px rgba(0,0,0,.09);padding:15px 16px 13px;transition:all .55s cubic-bezier(.22,1,.36,1)}.prompt{min-height:56px;display:flex;align-items:center}.prompt-text{color:#999;font-size:15px;transition:opacity .35s ease,transform .45s ease}.prompt-text.hidden{opacity:0;transform:translateY(-7px)}.style-row{display:flex;align-items:center;gap:9px;transition:opacity .45s ease,transform .55s cubic-bezier(.16,1,.3,1),max-height .55s ease}.style-row-label{font-size:12px;color:#999;margin-right:2px;white-space:nowrap}.styles{display:flex;gap:8px;flex-wrap:wrap}.style{height:38px;border:1px solid #e2e2e2;background:#fafafa;border-radius:12px;padding:0 12px;cursor:pointer;display:flex;align-items:center;gap:7px;font-weight:700;font-size:12px;transition:transform .2s,background .25s,border-color .25s,box-shadow .25s}.style:hover{transform:translateY(-1px);background:#fff}.style.selected{border-color:#edba16;background:#fff8d9;box-shadow:0 5px 18px rgba(247,201,40,.17)}.dot{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px}.minimal .dot{background:#e9e9e9}.bold .dot{background:#171717;color:#fff}.playful .dot{background:#ffe48a ;gap:8px;font-weight:800}.mobile-brand img{width:31px;height:31px;border-radius:9px}.mobile-new{display:block;border:1px solid #e6e6e6;background:#fff;border-radius:10px;padding:8px 11px;font-weight:700}.conversation{padding:18px 13px 190px}.welcome{padding:0 8px 18vh}.welcome h1{font-size:30px;letter-spacing:-1px}.welcome p{font-size:13px;line-height:1.45}.messages{padding-top:20px}.bubble{max-width:88%;font-size:14px}.logo-card{width:235px;height:235px;font-size:46px}.composer{padding:10px 10px 13px}.composer-inner{width:100%;border-radius:19px;padding:10px 10px 9px}.prompt{min-height:43px}.prompt-text{font-size:13px}.style-row{gap:6px}.style-row-label{font-size:10px}.styles{gap:5px}.style{height:32px;padding:0 8px;border-radius:10px;font-size:10px;gap:5px}.dot{width:20px;height:20px;border-radius:6px;font-size:9px}.style-row.compact{transform:translateY(-35px)}.style-row.compact .style.selected{height:25px;padding:0 7px}.style-row.compact .style.selected .dot{width:17px;height:17px}.input-row.visible{transform:translateY(-17px)}textarea{min-height:48px;font-size:14px;padding:4px}.send{width:42px;height:42px;margin-left:7px}.send svg{width:19px;height:19px}.hint{display:none}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><img src="./papaya-logo.svg" alt="Papaya"><span>Papaya</span></div><button class="newchat" id="newChat">+ Nouveau chat</button><div class="history"><div class="history-title">Discussions</div><div class="chatitem active">Nouveau logo</div></div></aside><main class="main"><header class="mobilebar"><div class="mobile-brand"><img src="./papaya-logo.svg" alt="Papaya"><span>Papaya</span></div><button class="mobile-new" id="mobileNew">+ Nouveau</button></header><section class="conversation"><div class="content"><div class="welcome" id="welcome"><h1>Quel logo veux-tu créer ?</h1><p>Choisis un style pour commencer.</p></div><div class="messages" id="messages"></div></div></section><div class="composer"><div class="composer-inner" id="composer"><div class="prompt"><div class="prompt-text" id="prompt">Décris ton logo, ton SaaS ou ton business...</div></div><div class="style-row" id="styleRow"><div class="style-row-label">Style</div><div class="styles"><button class="style minimal" data-style="minimal" type="button"><span class="dot">Aa</span>Minimaliste</button><button class="style bold" data-style="bold" type="button"><span class="dot">B</span>Bold</button><button class="style playful" data-style="playful" type="button"><span class="dot">✦</span>Créatif</button><button class="style luxury" data-style="luxury" type="button"><span class="dot">A</span>Premium</button></div></div><div class="input-row" id="inputRow"><textarea id="description" placeholder="Décris ton business..."></textarea><button class="send" id="send" aria-label="Créer le logo" type="button"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div><div class="hint" id="hint">Choisis un style pour continuer</div></div></div></main></div><script>const supabaseApp=window.supabase.createClient('https://xokmhuoqtncownuodqpe.supabase.co','sb_publishable_rVr3X7iYwJJExCqeBnWTxA_LoUWrede');(async()=>{const {data:{session},error}=await supabaseApp.auth.getSession();if(error||!session){location.replace('./index.html');return;}document.body.dataset.authenticated='true';})();let selectedStyle='';const cards=document.querySelectorAll('.style'),styleRow=document.getElementById('styleRow'),inputRow=document.getElementById('inputRow'),composer=document.getElementById('composer'),prompt=document.getElementById('prompt'),hint=document.getElementById('hint'),description=document.getElementById('description'),messages=document.getElementById('messages'),welcome=document.getElementById('welcome');cards.forEach(card=>card.addEventListener('click',()=>{cards.forEach(c=>c.classList.remove('selected'));card.classList.add('selected');selectedStyle=card.dataset.style;styleRow.classList.add('compact');prompt.classList.add('hidden');composer.classList.add('ready');hint.classList.add('hidden');setTimeout(()=>{inputRow.classList.add('visible');description.focus()},220)}));function send(){const text=description.value.trim();if(!selectedStyle||!text)return;const user=document.createElement('div');user.className='bubble user';user.textContent=text;messages.appendChild(user);const ai=document.createElement('div');ai.className='bubble ai';ai.textContent='Je prépare ton logo...';messages.appendChild(ai);description.value='';welcome.style.display='none';setTimeout(()=>{ai.textContent='Voici une première direction pour ton logo.';const logo=document.createElement('div');logo.className='logo-card';logo.textContent=text.split(/\s+/)[0].slice(0,2).toUpperCase()||'P';ai.appendChild(logo)},700)}document.getElementById('send').addEventListener('click',send);description.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});function reset(){selectedStyle='';cards.forEach(c=>c.classList.remove('selected'));styleRow.classList.remove('compact');inputRow.classList.remove('visible');prompt.classList.remove('hidden');composer.classList.remove('ready');hint.classList.remove('hidden');description.value='';messages.innerHTML='';welcome.style.display='block'}document.getElementById('newChat').addEventListener('click',reset);document.getElementById('mobileNew').addEventListener('click',reset);</script></body></html>
