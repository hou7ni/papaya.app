</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><img src="./papaya-logo.svg" alt="Papaya"><span>Papaya</span></div><button class="newchat" id="newChat">+ Nouveau chat</button><div class="history"><div class="history-title">Discussions</div><div class="chatitem active">Nouveau logo</div></div></aside><main class="main"><header class="mobilebar"><div class="mobile-brand"><img src="./papaya-logo.svg" alt="Papaya"><span>Papaya</span></div><button class="mobile-new" id="mobileNew">+ Nouveau</button></header><section class="conversation" id="conversation"><div class="content"><div class="welcome" id="welcome"><h1>Quel logo veux-tu créer ?</h1><p>Choisis d'abord un style, puis décris ce que tu veux.</p></div><div class="style-area" id="styleArea"><div class="style-label">Choisis un style</div><div class="styles"><button class="style minimal" data-style="minimal" type="button"><span class="dot">Aa</span>Minimaliste</button><button class="style bold" data-style="bold" type="button"><span class="dot">B</span>Bold</button><button class="style playful" data-style="playful" type="button"><span class="dot">✦</span>Fun & créatif</button><button class="style luxury" data-style="luxury" type="button"><span class="dot">A</span>Premium</button></div></div><div class="messages" id="messages"></div></div></section><div class="composer"><div class="composer-inner" id="composer"><div class="box"><textarea id="description" placeholder="Décris ton business, ton SaaS, ta marque..."></textarea><button class="send" id="send" aria-label="Envoyer" type="button"><svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div><div class="composer-hint">Entrée pour envoyer</div></div></div></main></div><script>const supabaseApp=window.supabase.createClient('https://xokmhuoqtncownuodqpe.supabase.co','sb_publishable_rVr3X7iYwJJExCqeBnWTxA_LoUWrede');(async()=>{const {data:{session},error}=await supabaseApp.auth.getSession();if(error||!session){location.replace('./index.html');return;}document.body.dataset.authenticated='true';})();let selectedStyle='';const cards=document.querySelectorAll('.style'),composer=document.getElementById('composer'),description=document.getElementById('description'),messages=document.getElementById('messages');function reset(){selectedStyle='';cards.forEach(c=>c.classList.remove('selected'));composer.classList.remove('visible');description.value='';messages.innerHTML='';document.getElementById('welcome').style.display='block';document.getElementById('styleArea').style.display='block';}cards.forEach(card=>card.addEventListener('click',()=>{cards.forEach(c=>c.classList.remove('selected'));card.classList.add('selected');selectedStyle=card.dataset.style;setTimeout(()=>{document.getElementById('welcome').style.opacity='.55';document.getElementById('styleArea').style.transform='scale(.88)';document.getElementById('styleArea').style.opacity='.55';composer.classList.add('visible');description.focus()},180)}));function send(){const text=description.value.trim();if(!selectedStyle||!text)return;const user=document.createElement('div');user.className='bubble user';user.textContent=text;messages.appendChild(user);const ai=document.createElement('div');ai.className='bubble ai';ai.textContent='Je prépare ton logo...';messages.appendChild(ai);description.value='';document.getElementById('welcome').style.display='none';document.getElementById('styleArea').style.display='none';setTimeout(()=>{ai.innerHTML='Voici une première direction pour ton logo.';const logo=document.createElement('div');logo.className='logo-card';logo.textContent=text.split(/\s+/)[0].slice(0,2).toUpperCase()||'P';ai.appendChild(logo)},650)}document.getElementById('send').addEventListener('click',send);description.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});document.getElementById('newChat').addEventListener('click',reset);document.getElement
