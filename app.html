;font:inherit;font-size:14px;line-height:1.4}.input-state.visible{display:flex;align-items:center;gap:10px}.result{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:min(708px,calc(100vw - 48px));display:none;z-index:2}.result.show{display:block}.message{display:flex;justify-content:flex-end;margin-bottom:12px}.bubble{background:#f7c928;border-radius:16px;padding:11px 14px;font-size:13px;max-width:80%}.logo-card{width:250px;height:250px;margin:16px auto 0;border-radius:24px;border:1px solid #e9e9e9;background:#fafafa;display:flex;align-items:center;justify-content:center;font-size:58px;font-weight:900;box-shadow:0 18px 50px rgba(0,0,0,.08);animation:heroIn .55s cubic-bezier(.22,1,.36,1) both}.side{position:absolute;left:28px;bottom:28px;z-index:4}.new{border:1px solid #e6e6e6;background:#fff;border-radius:12px;padding:10px 13px;font-weight:700;font-size:12px;cursor:pointer;box-shadow:0 7px 24px rgba(0,0,0,.05)}.mobile-menu{display:none}@keyframes heroIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@keyframes composerIn{from{opacity:0;transform:translateY(24px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}@media(max-width:900px){.nav{grid-template-columns:1fr auto;padding:0 22px}.links{display:none}.mobile-menu{display:flex;width:38px;height:38px;border:1px solid #e8e8e8;border-radius:10px;background:#fff;align-items:center;justify-content:center}.nav-right{display:none}.hero{padding-bottom:12vh}.headline h1{letter-spacing:-2.5px}.composer{width:min(708px,calc(100vw - 36px))}.styles{overflow:auto;scrollbar-width:none}.styles::-webkit-scrollbar{display:none}.side{left:18px;bottom:18px}}@media(max-width:560px){.nav{height:64px;padding:0 15px}.brand{font-size:18px}.brand img{width:31px;height:31px}.hero{padding:0 12px 10vh;justify-content:center}.eyebrow{margin-bottom:14px}.headline h1{font-size:38px;letter-spacing:-1.9px}.headline p{font-size:13px;margin:13px 0 24px}.composer{width:calc(100vw - 24px);border-radius:21px;min-height:0}.placeholder{height:58px;padding:0 16px;font-size:13px}.composer-main{display:flex;flex-wrap:wrap;padding:10px}.styles{order:1;width:100%;flex-basis:100%;padding-bottom:2px}.style{height:33px;padding:0 8px;font-size:10px}.tools{order:2;margin-left:auto}.tool{width:33px;height:33px}.send{width:35px;height:35px}.result{width:calc(100vw - 24px)}.logo-card{width:210px;height:210px}.side{display:none}}@media(max-width:380px){.style{padding:0 7px}.style .dot{display:none}.headline h1{font-size:34px}}</style></head><body><div class="page"><nav class="nav"><div class="brand"><img src="./papaya-logo.svg" alt="Papaya"><span>Papaya</span></div><div class="links"><span>Créer</span><span>Mes logos</span><span>Styles</span></div><div class="nav-right"><button class="nav-cta" id="navNew">+ Nouveau logo</button></div><button class="mobile-menu" id="mobileNew" aria-label="Nouveau logo"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button></nav><main class="hero"><div class="headline" id="headline"><div class="eyebrow"><i></i>Créateur de logos IA</div><h1>Quel logo veux-tu créer ?</h1><p>Décris ton idée, choisis un style et Papaya s'occupe du reste.</p></div><div class="composer" id="composer"><div class="placeholder" id="placeholder">Décris ton logo, ton SaaS ou ton business...</div><div class="composer-main"><div class="styles"><button class="style minimal" data-style="minimal" type="button"><span class="dot">Aa</span>Minimaliste</button><button class="style bold" data-style="bold" type="button"><span class="dot">B</span>Bold</button><button class="style creative" data-style="creative" type="button"><span class="dot">✦</span>Créatif</button><button class="style premium" data-style="premium" type="button"><span class="dot">A</span>Premium</button></div><div class="tools"><button class="tool" type="button" aria-label="Ajouter une image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9" r="1.5"/><path d="m5 17 4.5-4.5 3.5 3 2.5-2.5L19 17"/></svg></button><button class="send" id="send" aria-label="Créer le logo" type="button"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div><div class="input-state" id="inputState"><textarea id="description" placeholder="Décris ton business..."></textarea><button class="send" id="send2" aria-label="Créer le logo" type="button"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div></main><div class="result" id="result"><div class="message"><div class="bubble" id="userText"></div></div><div class="logo-card" id="logoCard"></div></div><div class="side"><button class="new" id="sideNew">+ Nouveau logo</button></div></div><script>const supabaseApp=window.supabase.createClient('https://xokmhuoqtncownuodqpe.supabase.co','sb_publishable_rVr3X7iYwJJExCqeBnWTxA_LoUWrede');(async()=>{const{data:{session},error}=await supabaseApp.auth.getSession();if(error||!session){location.replace('./index.html');return;}document.body.dataset.authenticated='true';})();const styles=document.querySelectorAll('.style'),inputState=document.getElementById('inputState'),placeholder=document.getElementById('placeholder'),description=document.getElementById('description'),result=document.getElementById('result'),userText=document.getElementById('userText'),logoCard=document.getElementById('logoCard'),headline=document.getElementById('headline');let selected='';styles.forEach(s=>s.addEventListener('click',()=>{styles.forEach(x=>x.classList.remove('selected'));s.classList.add('selected');selected=s.dataset.style;placeholder.style.opacity='0';placeholder.style.transform='translateY(-8px)';setTimeout(()=>{placeholder.style.display='none';inputState.classList.add('visible');description.focus()},260)}));function create(){const text=description.value.trim();if(!selected||!text)return;userText.textContent=text;logoCard.textContent=text.split(/\s+/)[0].slice(0,2).toUpperCase()||'P';headline.style.display='none';document.getElementById('composer').style.display='none';result.classList.add('show')}function reset(){selected='';styles.forEach(x=>x.classList.remove('selected'));description.value='';result.classList.remove('show');headline.style.display='block';document.getElementById('composer').style.display='block';placeholder.style.display='flex';placeholder.style.opacity='1';placeholder.style.transform='none';inputState.classList.remove('visible')}document.getElementById('send').addEventListener('click',()=>{if(selected)create()});document.getElementById('send2').addEventListener('click',create);description.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();create()}});['navNew','mobileNew','sideNew'].forEach(id=>document.getElementById(id).addEventListener('click',reset));</script></body></html>
